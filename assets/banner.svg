<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-width=".8" d="M 40 0 L 0 0 0 40" opacity=".6"/><circle cx="40" cy="40" r="1" fill="#38bdf8" opacity=".3"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes pulseRing{0%{r:18px;opacity:.8;stroke-width:2.5}50%{r:65px;opacity:.35;stroke-width:1.5}}@keyframes satelliteOrbit{0%{transform:rotate(0deg) translateX(130px) rotate(0deg)}}@keyframes beamScan{0%{opacity:.25;transform:translateY(0)}50%{opacity:.75;transform:translateY(-8px)}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.ring-1{animation:pulseRing 3.5s cubic-bezier(.2,.8,.4,1) infinite}.ring-2{animation:pulseRing 3.5s cubic-bezier(.2,.8,.4,1) infinite 1.2s}.ring-3{animation:pulseRing 3.5s cubic-bezier(.2,.8,.4,1) infinite 2.4s}.sat-orbit{animation:satelliteOrbit 16s linear infinite;transform-origin:1020px 180px}.beam{animation:beamScan 4s ease-in-out infinite}.floating-badge{animation:floatSlow 5s ease-in-out infinite}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><g opacity=".85"><circle cx="1020" cy="180" r="18" fill="none" stroke="#38bdf8" class="ring-1"/><circle cx="1020" cy="180" r="18" fill="none" stroke="#818cf8" class="ring-2"/><circle cx="1020" cy="180" r="18" fill="none" stroke="#38bdf8" class="ring-3"/><circle cx="1020" cy="180" r="12" fill="#0284c7"/><circle cx="1020" cy="180" r="5" fill="#f8fafc"/><circle cx="1020" cy="180" r="130" fill="none" stroke="#334155" stroke-dasharray="4 6" opacity=".5"/><g class="sat-orbit"><g transform="translate(1020, 180)"><rect width="18" height="12" x="-9" y="-6" fill="#38bdf8" filter="url(#glow)" rx="2"/><rect width="12" height="8" x="-24" y="-4" fill="#0284c7" stroke="#38bdf8" stroke-width=".8" rx="1"/><rect width="12" height="8" x="12" y="-4" fill="#0284c7" stroke="#38bdf8" stroke-width=".8" rx="1"/></g></g><line x1="880" x2="1020" y1="90" y2="180" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="1.2" class="beam" opacity=".45"/><line x1="1140" x2="1020" y1="100" y2="180" stroke="#818cf8" stroke-dasharray="3 3" stroke-width="1.2" class="beam" opacity=".45"/><line x1="1020" x2="1060" y1="180" y2="290" stroke="#c084fc" stroke-dasharray="4 4" stroke-width="1.5" class="beam" opacity=".6"/></g><g><g class="floating-badge" transform="translate(70, 75)"><rect width="280" height="28" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity=".95" rx="14"/><circle cx="14" cy="14" r="5" fill="#10b981"/><text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing=".8">CENTIMETER-LEVEL POSITIONING</text></g><text x="0" y="85" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-.5" transform="translate(70, 75)">Awesome Real-Time Kinematics</text><text x="0" y="125" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" transform="translate(70, 75)">&amp; High-Precision GNSS / GPS Ecosystem</text><text x="0" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" transform="translate(70, 75)">Curated RTK/PPK Positioning Engines • NTRIP Casters • Geodesy &amp; Autonomous Navigation</text><g transform="translate(70, 75) translate(0, 195)"><rect width="105" height="26" x="0" y="0" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6"/><text x="14" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📡 RTK / PPK</text><rect width="125" height="26" x="115" y="0" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6"/><text x="127" y="17" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 NTRIP Caster</text><rect width="115" height="26" x="250" y="0" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6"/><text x="262" y="17" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛰️ PPP / PPP-AR</text><rect width="145" height="26" x="375" y="0" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6"/><text x="387" y="17" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🚜 Auto-Steer &amp; ROS 2</text></g></g></svg>