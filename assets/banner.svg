<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseRing {
        0% { r: 18px; opacity: 0.8; stroke-width: 2.5; }
        50% { r: 65px; opacity: 0.35; stroke-width: 1.5; }
        100% { r: 110px; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes satelliteOrbit {
        0% { transform: rotate(0deg) translateX(130px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(130px) rotate(-360deg); }
      }
      @keyframes beamScan {
        0%, 100% { opacity: 0.25; transform: translateY(0px); }
        50% { opacity: 0.75; transform: translateY(-8px); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .ring-1 { animation: pulseRing 3.5s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; }
      .ring-2 { animation: pulseRing 3.5s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 1.2s; }
      .ring-3 { animation: pulseRing 3.5s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 2.4s; }
      .sat-orbit { animation: satelliteOrbit 16s linear infinite; transform-origin: 1020px 180px; }
      .beam { animation: beamScan 4s ease-in-out infinite; }
      .floating-badge { animation: floatSlow 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Abstract Dynamic Constellation Signal Waves (Background/Right Side) -->
  <g opacity="0.85">
    <!-- Concentric Kinematic Pulses -->
    <circle cx="1020" cy="180" r="18" fill="none" stroke="#38bdf8" class="ring-1" />
    <circle cx="1020" cy="180" r="18" fill="none" stroke="#818cf8" class="ring-2" />
    <circle cx="1020" cy="180" r="18" fill="none" stroke="#38bdf8" class="ring-3" />

    <!-- RTK Base / Rover Target Station Center -->
    <circle cx="1020" cy="180" r="12" fill="#0284c7" />
    <circle cx="1020" cy="180" r="5" fill="#f8fafc" />

    <!-- Orbital Trajectory Line -->
    <circle cx="1020" cy="180" r="130" fill="none" stroke="#334155" stroke-dasharray="4 6" opacity="0.5" />

    <!-- Satellite in Dynamic Orbit -->
    <g class="sat-orbit">
      <g transform="translate(1020, 180)">
        <!-- Satellite Body -->
        <rect x="-9" y="-6" width="18" height="12" rx="2" fill="#38bdf8" filter="url(#glow)" />
        <!-- Solar Panels -->
        <rect x="-24" y="-4" width="12" height="8" rx="1" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8" />
        <rect x="12" y="-4" width="12" height="8" rx="1" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8" />
      </g>
    </g>

    <!-- Carrier Phase Laser Signal Lines -->
    <line x1="880" y1="90" x2="1020" y2="180" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.45" class="beam" />
    <line x1="1140" y1="100" x2="1020" y2="180" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.45" class="beam" />
    <line x1="1020" y1="180" x2="1060" y2="290" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" class="beam" />
  </g>

  <!-- Left/Foreground Title Content (Crisp, High Contrast, Guaranteed Foreground) -->
  <g transform="translate(70, 75)">
    <!-- Category Pill Badge -->
    <g class="floating-badge">
      <rect x="0" y="0" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.95" />
      <circle cx="14" cy="14" r="5" fill="#10b981" />
      <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.8">CENTIMETER-LEVEL POSITIONING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Awesome Real-Time Kinematics
    </text>

    <!-- Subtitle with Gradient Accent -->
    <text x="0" y="125" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700">
      &amp; High-Precision GNSS / GPS Ecosystem
    </text>

    <!-- Description -->
    <text x="0" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      Curated RTK/PPK Positioning Engines • NTRIP Casters • Geodesy &amp; Autonomous Navigation
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 195)">
      <!-- Pill 1: RTK / PPK -->
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📡 RTK / PPK</text>

      <!-- Pill 2: NTRIP Casters -->
      <rect x="115" y="0" width="125" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="127" y="17" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 NTRIP Caster</text>

      <!-- Pill 3: PPP &amp; PPP-AR -->
      <rect x="250" y="0" width="115" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="262" y="17" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛰️ PPP / PPP-AR</text>

      <!-- Pill 4: Sub-cm Robotics -->
      <rect x="375" y="0" width="145" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="387" y="17" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🚜 Auto-Steer &amp; ROS 2</text>
    </g>
  </g>
</svg>
